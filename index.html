<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ordered List API</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Ordered List API</h1>
      <button class="header-button" onclick="openCreateModal()">+ New List</button>
    </div>

    <div id="createModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">Create a New List</div>
        <div class="modal-body">
          <input type="text" id="modalListName" placeholder="Enter list name..." value="My Todo List">
        </div>
        <div id="modalStatus" class="status"></div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
          <button class="btn-create" onclick="createListFromModal()">Create</button>
        </div>
      </div>
    </div>

    <div class="content">
      <div class="main-area">
        <div class="list-navigator">
          <button class="nav-arrow" id="prevBtn" onclick="prevList()" title="Previous list">←</button>
          <div class="list-info">
            <h2 class="list-title" id="listTitle">Loading...</h2>
            <div class="list-counter" id="listCounter"></div>
          </div>
          <button class="nav-arrow" id="nextBtn" onclick="nextList()" title="Next list">→</button>
        </div>

        <div class="add-item-form">
          <input type="text" id="itemName" placeholder="Add a new item..." value="">
          <button onclick="addItem()">Add</button>
        </div>

        <div class="items-scroll" id="itemsContainer">
          <div class="empty-state">Loading items...</div>
        </div>

        <div id="itemStatus" class="status"></div>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:3000';
    let allLists = [];
    let currentListIndex = 0;
    let currentListId = null;

    function openCreateModal() {
      document.getElementById('createModal').classList.add('show');
      document.getElementById('modalListName').focus();
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.remove('show');
      document.getElementById('modalListName').value = '';
      document.getElementById('modalStatus').classList.remove('show');
    }

    async function showStatus(elementId, message, isError = false) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `status show ${isError ? 'error' : 'success'}`;
      setTimeout(() => el.classList.remove('show'), 4000);
    }

    async function createListFromModal() {
      const name = document.getElementById('modalListName').value.trim();
      if (!name) return showStatus('modalStatus', 'Please enter a list name', true);

      try {
        const res = await fetch(`${API}/lists`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        closeCreateModal();
        showStatus('itemStatus', `List "${name}" created!`);
        await loadLists();
      } catch (err) {
        showStatus('modalStatus', 'Failed to create list', true);
      }
    }

    async function loadLists() {
      try {
        const res = await fetch(`${API}/lists`);
        allLists = await res.json();
        
        if (allLists.length === 0) {
          document.getElementById('listTitle').textContent = 'No Lists';
          document.getElementById('listCounter').textContent = '';
          document.getElementById('itemsContainer').innerHTML = '<div class="empty-state">Create a list to get started!</div>';
          document.getElementById('prevBtn').style.display = 'none';
          document.getElementById('nextBtn').style.display = 'none';
          return;
        }

        currentListIndex = 0;
        showList(0);
      } catch (err) {
        console.error('Failed to load lists', err);
      }
    }

    function showList(index) {
      if (index < 0 || index >= allLists.length) return;
      
      currentListIndex = index;
      const list = allLists[index];
      currentListId = list.id;

      document.getElementById('listTitle').textContent = list.name;
      document.getElementById('listCounter').textContent = `List ${index + 1} of ${allLists.length}`;

      document.getElementById('prevBtn').style.display = index === 0 ? 'none' : 'block';
      document.getElementById('nextBtn').style.display = index === allLists.length - 1 ? 'none' : 'block';

      loadItems();
    }

    function prevList() {
      if (currentListIndex > 0) {
        showList(currentListIndex - 1);
      }
    }

    function nextList() {
      if (currentListIndex < allLists.length - 1) {
        showList(currentListIndex + 1);
      }
    }

    async function addItem() {
      if (!currentListId) {
        showStatus('itemStatus', 'No list selected', true);
        return;
      }
      
      const name = document.getElementById('itemName').value.trim();
      if (!name) {
        showStatus('itemStatus', 'Please enter an item name', true);
        return;
      }

      try {
        const res = await fetch(`${API}/lists/${currentListId}/items`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        showStatus('itemStatus', `Item "${name}" added!`);
        document.getElementById('itemName').value = '';
        await loadItems();
      } catch (err) {
        showStatus('itemStatus', 'Failed to add item', true);
      }
    }

    async function loadItems() {
      if (!currentListId) return;

      try {
        const res = await fetch(`${API}/lists/${currentListId}/items`);
        const items = await res.json();
        const container = document.getElementById('itemsContainer');

        if (items.length === 0) {
          container.innerHTML = '<div class="empty-state">No items yet. Add one to get started!</div>';
          return;
        }

        container.innerHTML = items
          .map(item => `
            <div class="list-item" data-id="${item.id}" data-position="${item.position}">
              <span class="drag-handle">⋮⋮</span>
              <div class="list-item-text">
                <div class="list-item-name">${item.name}</div>
                <div class="list-item-pos">Position: ${item.position}</div>
              </div>
              <div class="list-item-actions">
                <button class="btn-delete" onclick="deleteItem(${item.id})">Delete</button>
              </div>
            </div>
          `)
          .join('');

        initSortable();
      } catch (err) {
        console.error('Failed to load items', err);
      }
    }

    function initSortable() {
      const container = document.getElementById('itemsContainer');
      if (container.querySelector('.empty-state')) return;

      if (container.sortableInstance) {
        container.sortableInstance.destroy();
      }

      container.sortableInstance = Sortable.create(container, {
        animation: 150,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        handle: '.drag-handle, .list-item-text',
        onEnd: async (evt) => {
          const items = Array.from(container.querySelectorAll('.list-item'));
          const movedItem = items[evt.newIndex];
          const newPosition = evt.newIndex + 1;
          const itemId = movedItem.dataset.id;

          try {
            const res = await fetch(`${API}/items/${itemId}/position`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ position: newPosition })
            });

            if (!res.ok) {
              await loadItems();
              return;
            }

            await loadItems();
          } catch (err) {
            console.error('Failed to move item', err);
            await loadItems();
          }
        }
      });
    }

    async function deleteItem(itemId) {
      if (!confirm('Delete this item?')) return;

      try {
        const res = await fetch(`${API}/items/${itemId}`, { method: 'DELETE' });
        if (res.ok) {
          showStatus('itemStatus', 'item deleted!');
          await loadItems();
        } else {
          showStatus('itemStatus', 'failed to delete item', true);
        }
      } catch (err) {
        showStatus('itemStatus', 'failed to delete item', true);
      }
    }

    document.addEventListener('click', (e) => {
      const modal = document.getElementById('createModal');
      if (e.target === modal) {
        closeCreateModal();
      }
    });

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('createModal').classList.contains('show')) {
          createListFromModal();
        } else if (document.activeElement.id === 'itemName') {
          addItem();
        }
      }
    });

    window.addEventListener('load', loadLists);
  </script>
</body>
</html>
